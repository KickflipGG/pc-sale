services:
  db:
    image: postgres:18-alpine
    container_name: pc-sale-db
    environment:
      POSTGRES_PASSWORD: admin
    volumes:
      # Начиная с PostgreSQL 18 образ хранит данные в подкаталоге с номером
      # версии, поэтому том подключается к /var/lib/postgresql, а не к
      # /var/lib/postgresql/data, как было в версиях 17 и ниже.
      - pgdata:/var/lib/postgresql
      # при первом запуске PostgreSQL выполняет эти скрипты автоматически
      - ./backend/database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: pc-sale-app
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:admin@db:5432/pc_sale
      SECRET_KEY: pc-sale-container-secret-key
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
