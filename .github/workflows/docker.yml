name: Сборка и публикация Docker-образов

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Проверка проекта
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install -r backend/requirements.txt

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Создание схемы базы данных
        env:
          PGPASSWORD: admin
        run: |
          psql -h localhost -U postgres -d postgres -f backend/database/01_schema.sql
          psql -h localhost -U postgres -d pc_sale -f backend/database/02_seed.sql

      - name: Сборка интерфейса
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Дымовое тестирование API
        env:
          DATABASE_URL: postgresql+psycopg://postgres:admin@localhost:5432/pc_sale
          SECRET_KEY: github-actions-test-key
        run: |
          cd backend
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done

          for route in api/health api/categories api/products api/products/office-pc-i7-3770; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000/$route")
            echo "$route -> $code"
            test "$code" = "200"
          done

          count=$(curl -s "http://127.0.0.1:8000/api/products" | python -c "import json,sys; print(json.load(sys.stdin)['total'])")
          echo "товаров в каталоге: $count"
          test "$count" = "21"

          kill $SERVER_PID

  build:
    name: Сборка образа (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    # Каждый сервис проекта собирается своей матричной сборкой
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: kickflipgg/pc-sale-api
            context: ./backend
            file: ./backend/Dockerfile
          - name: web
            image: kickflipgg/pc-sale-web
            context: .
            file: ./deploy/nginx/Dockerfile

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Настройка Buildx
        uses: docker/setup-buildx-action@v3

      - name: Вход в GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Формирование тегов образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # На pull request образы только собираются — публикация идёт с основной ветки
      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
