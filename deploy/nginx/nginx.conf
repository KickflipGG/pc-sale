# Единая точка входа в приложение PC Sale.
# HTTP перенаправляется на HTTPS, статика отдаётся напрямую,
# запросы к /api/ уходят в контейнер приложения.
#
# Файл подключается к контейнеру вместо /etc/nginx/conf.d/default.conf.

# Сжатие ответов (директивы допустимы в контексте http, куда попадает этот файл)
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml application/xml;

# HTTP → HTTPS: постоянное перенаправление на защищённую версию
server {
    listen 80;
    server_name pc-sale.localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pc-sale.localhost;

    ssl_certificate     /etc/nginx/certs/pc-sale.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/pc-sale.localhost-key.pem;

    # Запросы к API — в контейнер приложения.
    # Путь в proxy_pass не указан, поэтому запрос уходит целиком, вместе с /api/.
    # Префикс ^~ запрещает проверять регулярные выражения ниже:
    # иначе файл вида /api/report.css ушёл бы в статику вместо приложения
    location ^~ /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        # Исходные данные запроса: без них приложение считает,
        # что запрос пришёл по HTTP с внутреннего адреса
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Ответы API не должны попадать в поисковый индекс
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Файлы сборки: у них в имени есть хеш содержимого, поэтому их можно
    # кешировать надолго. Без этого Lighthouse ругается на время жизни кеша
    # (аудит «Use efficient cache lifetimes»)
    location ~* \.(?:js|css|png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        root /usr/share/nginx/html;
        expires 1y;
        try_files $uri =404;
    }

    # Всё остальное — собранный интерфейс.
    # index.html кешировать надолго нельзя: он ссылается на файлы с хешем
    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # Без этой строки обновление страницы вида /catalog вернёт 404:
        # файла /catalog на диске нет, этот маршрут обрабатывает React
        try_files $uri $uri/ /index.html;
    }
}
